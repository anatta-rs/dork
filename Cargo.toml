[package]
name = "dork"
description = "Unified search-engine abstraction with DuckDuckGo + Google backends"
version = "0.1.1"
edition = "2024"
authors = ["Anatta <noreply@anatta.dev>"]
license = "Apache-2.0"
repository = "https://github.com/anatta-rs/dork"
keywords = ["search", "search-engine", "ddg", "duckduckgo", "google"]
categories = ["api-bindings", "asynchronous", "web-programming"]

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = "2"
scraper = { version = "0.22", optional = true }

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
pretty_assertions = "1"
mockito = "1"

[features]
default = ["duckduckgo"]
duckduckgo = ["dep:scraper"]
google = []

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
